[package]
name = "silex-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = []
description = "Local-first native knowledge workspace built with Rust and SQLite"
license = "MIT"

[dependencies]
anyhow = "1"
directories = "6"
# Default features: wgpu, clipboard, accesskit, x11/wayland (with client-side decorations and dlopen).
eframe = "0.37"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
# Markdown import (H4.2): CommonMark parser, MIT, pure Rust.
pulldown-cmark = { version = "0.13", default-features = false }


[dev-dependencies]
# UI snapshots (H5.2): renders the app headless to PNG for review and to
# catch unintended visual changes. MIT OR Apache-2.0, same version as egui.
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
