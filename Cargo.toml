[package]
name = "silex-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = []
description = "Local-first native knowledge workspace built with Rust and SQLite"
license = "MIT"

[dependencies]
anyhow = "1"
directories = "6"
# Default features: wgpu, clipboard, accesskit, x11/wayland (with client-side decorations and dlopen).
eframe = "0.37"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
# Markdown import (H4.2): CommonMark parser, MIT, pure Rust.
pulldown-cmark = { version = "0.13", default-features = false }


[target.'cfg(windows)'.build-dependencies]
# App icon inside the Windows .exe (build.rs, ADR 0005). MIT; without its
# default `toml` feature it adds no other dependency.
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
# UI snapshots (H5.2): renders the app headless to PNG for review and to
# catch unintended visual changes. MIT OR Apache-2.0, same version as egui.
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

# Installers (H5.9, ADR 0005): `cargo packager --release`, after
# `cargo install cargo-packager --locked`. Output in dist/ (ignored by Git).
# macOS: .app and .dmg; Windows: NSIS installer; Linux: .deb and AppImage.
[package.metadata.packager]
product-name = "Silex"
# Also the name of the data folder on macOS (`directories`); never change it.
identifier = "dev.silex.Silex"
publisher = "Silex"
# Shown by Linux menus and package managers (.deb Maintainer: `authors`).
description = "Espacio de trabajo local para escribir y organizar notas"
long-description = "Silex guarda tus páginas en una base SQLite en tu equipo, sin cuentas, sin nube y sin telemetría. Editor por bloques, búsqueda global, papelera, copias de seguridad y exportación a Markdown."
authors = ["Yev"]
copyright = "Copyright (c) 2026 Yev"
category = "Productivity"
# No `license-file`: it would make the .dmg and the Windows installer ask the
# user to accept the MIT license, which needs no acceptance.
before-packaging-command = "cargo build --release --locked"
out-dir = "dist"
icons = [
    "assets/app-icon/silex-*.png",
    "assets/app-icon/Silex.icns",
    "assets/app-icon/silex.ico",
]
binaries = [{ path = "silex-desktop", main = true }]

[package.metadata.packager.nsis]
# cargo-packager's template with the per-user install folder moved to
# %LOCALAPPDATA%\Programs\Silex, outside the data folder (see its header).
template = "packaging/windows/installer.nsi"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# Ad-hoc signature: the bundle is sealed, but macOS still warns about an
# unidentified developer. Developer ID signing is pending (ADR 0005).
signing-identity = "-"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
