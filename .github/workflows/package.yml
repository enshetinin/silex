name: Paquetes
# Builds the installers with cargo-packager (ADR 0005), checks them and keeps
# them as artifacts of the run (Actions → this run → Artifacts). On a version
# tag (`vX.Y.Z`, ADR 0014) it also makes a DRAFT release with them: the owner
# reviews and publishes it by hand. Nothing is ever published by the CI.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - packaging/**
      - src/main.rs
      - assets/app-icon/**
      - .github/workflows/package.yml

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          # The oldest supported Ubuntu image: the .deb and the AppImage need
          # at least the glibc they were built with.
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PACKAGER_VERSION: "0.11.8"
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against Cargo.toml and CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no es la versión de Cargo.toml ($version)"
            exit 1
          fi
          sh scripts/release-notes.sh "$version" > /dev/null
      - name: Linux system dependencies for eframe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev pkg-config desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version ${{ env.CARGO_PACKAGER_VERSION }}
      - name: Package
        run: cargo packager --release

      - name: Check the macOS packages
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Silex.app
          plutil -p dist/Silex.app/Contents/Info.plist | grep '"CFBundleIdentifier" => "dev.silex.Silex"'
          test -f dist/Silex.app/Contents/Resources/Silex.icns
          hdiutil verify dist/*.dmg

      - name: Check the Windows installer (install, then uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No se generó el instalador' }
          # A stand-in for the user's database, where the app keeps it
          # (`directories`: %LOCALAPPDATA%\silex\Silex\data). It must survive
          # install and uninstall. Always named parameters: with positional
          # ones, Set-Content took the text as the path (a false alarm once).
          $data = Join-Path -Path $env:LOCALAPPDATA -ChildPath 'silex\Silex\data'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $marker = Join-Path -Path $data -ChildPath 'silex.sqlite3'
          Set-Content -LiteralPath $marker -Value 'datos del usuario' -NoNewline
          function Assert-Data([string] $when) {
            if (-not (Test-Path -LiteralPath $marker)) { throw "$when borró los datos del usuario" }
            if ((Get-Content -LiteralPath $marker -Raw) -ne 'datos del usuario') { throw "$when cambió los datos del usuario" }
          }
          Assert-Data 'La preparación'

          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          Assert-Data 'La instalación'
          # Per-user install folder of packaging/windows/installer.nsi.
          $dir = Join-Path -Path $env:LOCALAPPDATA -ChildPath 'Programs\Silex'
          $exe = Join-Path -Path $dir -ChildPath 'silex-desktop.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "No se instaló $exe" }
          $info = (Get-Item -LiteralPath $exe).VersionInfo
          if ($info.ProductName -ne 'Silex') { throw "Sin recursos en el .exe: '$($info.ProductName)'" }

          Start-Process -FilePath (Join-Path -Path $dir -ChildPath 'uninstall.exe') -ArgumentList '/S' -Wait
          # The uninstaller copies itself and finishes in the background.
          for ($i = 0; $i -lt 30 -and (Test-Path -LiteralPath $dir); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path -LiteralPath $dir) { throw "La desinstalación dejó $dir" }
          Assert-Data 'La desinstalación'

      - name: Check the Linux packages
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | tee contents.txt
          # Paths are listed with or without a leading "./".
          for path in usr/bin/silex-desktop \
              usr/share/applications/silex-desktop.desktop \
              usr/share/icons/hicolor/256x256/apps/silex-desktop.png; do
            grep -Eq "(^| |\./)$path\$" contents.txt || { echo "Falta $path en el .deb"; exit 1; }
          done
          sudo apt-get install -y ./dist/*.deb
          test -x /usr/bin/silex-desktop
          cat /usr/share/applications/silex-desktop.desktop
          desktop-file-validate /usr/share/applications/silex-desktop.desktop
          ls -l dist/*.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: silex-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  # Only for a version tag: one draft release with the packages of the three
  # systems and the CHANGELOG section as notes. It fails rather than touch a
  # release that already exists.
  release:
    name: Borrador de la release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: silex-*
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sh scripts/release-notes.sh "$version" > notes.md
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag \
            --title "Silex $version" \
            --notes-file notes.md
