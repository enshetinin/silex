<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Silex app icon. Source of every size in assets/app-icon (see README).
       Body: the 824 px rounded square of the macOS icon grid, in the accent
       blues of the light palette. Glyph: a knapped flint ("sílex") shard,
       its facets drawn as white at different opacities. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4AA6EE"/>
      <stop offset="1" stop-color="#1A5C9E"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12" result="blur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.30"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="stone-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="10"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  </g>

  <g filter="url(#stone-shadow)" transform="rotate(-20 512 520)">
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round">
      <!-- Outline, clockwise from the tip: P0 520,226  P1 612,332  P2 670,452
           P3 690,566  P4 670,686  P5 606,774  P6 512,808  P7 418,772
           P8 356,688  P9 338,570  P10 364,446  P11 428,330.
           Ridge: R 514,410 and C 530,598. -->
      <polygon points="520,226 612,332 514,410" fill-opacity="1"/>
      <polygon points="612,332 670,452 514,410" fill-opacity="0.84" stroke-opacity="0.84"/>
      <polygon points="670,452 690,566 530,598 514,410" fill-opacity="0.95" stroke-opacity="0.95"/>
      <polygon points="690,566 670,686 530,598" fill-opacity="0.76" stroke-opacity="0.76"/>
      <polygon points="670,686 606,774 512,808 530,598" fill-opacity="0.88" stroke-opacity="0.88"/>
      <polygon points="512,808 418,772 356,688 530,598" fill-opacity="0.70" stroke-opacity="0.70"/>
      <polygon points="356,688 338,570 530,598" fill-opacity="0.82" stroke-opacity="0.82"/>
      <polygon points="338,570 364,446 514,410 530,598" fill-opacity="0.64" stroke-opacity="0.64"/>
      <polygon points="364,446 428,330 514,410" fill-opacity="0.78" stroke-opacity="0.78"/>
      <polygon points="428,330 520,226 514,410" fill-opacity="0.92" stroke-opacity="0.92"/>
    </g>
  </g>
</svg>
